<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프롬프트 보관함</title>
    <style>
        /* 애플 감성 시스템 색상 */
        :root {
            --bg-color: #f2f2f7; 
            --sidebar-bg: #f2f2f7;
            --card-bg: #ffffff;
            --text-primary: #1c1c1e;
            --text-secondary: #8e8e93;
            --accent-color: #007aff;
            --hover-color: #e5e5ea;
            --border-radius: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 메인 레이아웃 */
        .app-container {
            display: flex;
            height: 100vh;
            padding: 20px;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ---------------- 좌측 사이드바 (폴더 및 리스트) ---------------- */
        .sidebar {
            width: 320px;
            display: flex;
            flex-direction: column;
            background-color: transparent;
            height: 100%;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 10px 20px 10px;
        }

        .sidebar-header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .add-folder-btn {
            background: transparent;
            border: none;
            color: var(--accent-color);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 12px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .add-folder-btn:hover {
            background: rgba(0, 122, 255, 0.1);
        }

        .folder-list {
            list-style: none;
            overflow-y: auto;
            padding: 0 5px;
            flex: 1;
        }

        .folder-list::-webkit-scrollbar { width: 0px; } /* 스크롤바 숨김 */

        /* 폴더 아이템 */
        .folder-item {
            margin-bottom: 8px;
        }

        .folder-header {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 15px;
            group: folder;
        }

        .folder-header:hover {
            background-color: var(--hover-color);
        }

        .chevron-icon {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            transition: transform 0.2s ease;
            color: var(--text-secondary);
        }

        .folder-item.open .chevron-icon {
            transform: rotate(90deg);
        }

        .folder-title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 폴더 내 프롬프트 추가 버튼, 폴더 삭제 버튼 */
        .folder-actions {
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .folder-header:hover .folder-actions {
            opacity: 1;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border-radius: 6px;
        }

        .icon-btn:hover {
            background: rgba(0,0,0,0.08);
            color: var(--text-primary);
        }

        .icon-btn.delete:hover {
            color: #ff3b30;
        }

        /* 프롬프트 리스트 (폴더 하위) */
        .prompt-list {
            list-style: none;
            padding-left: 24px; /* 들여쓰기 */
            display: none; /* 기본 숨김 */
            margin-top: 4px;
        }

        .folder-item.open .prompt-list {
            display: block;
        }

        .prompt-item {
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 15px;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
        }

        .prompt-item::before {
            content: '📄';
            margin-right: 8px;
            font-size: 13px;
            opacity: 0.7;
        }

        .prompt-item:hover {
            background-color: var(--hover-color);
        }

        .prompt-item.active {
            background-color: var(--accent-color);
            color: #ffffff;
            font-weight: 500;
        }

        .prompt-item.active::before {
            opacity: 1;
        }

        /* ---------------- 우측 메인 에디터 ---------------- */
        .editor-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .editor-card {
            background-color: var(--card-bg);
            width: 100%;
            height: 100%;
            border-radius: var(--border-radius);
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            
            opacity: 0;
            transform: scale(0.98) translateY(10px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .editor-card.show {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .title-input {
            flex: 1;
            font-size: 32px;
            font-weight: 700;
            border: none;
            outline: none;
            color: var(--text-primary);
            background: transparent;
            font-family: inherit;
            letter-spacing: -0.5px;
        }

        .title-input::placeholder { color: #d1d1d6; }

        .delete-prompt-btn {
            background: transparent;
            border: none;
            color: #ff3b30;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .delete-prompt-btn:hover {
            background: #ffe5e5;
        }

        .content-input {
            flex: 1;
            font-size: 16px;
            line-height: 1.6;
            border: none;
            outline: none;
            resize: none;
            color: #333;
            background: transparent;
            font-family: inherit;
        }

        .content-input::placeholder { color: #c7c7cc; }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            font-size: 16px;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            opacity: 0.4;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 좌측 사이드바 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>프롬프트</h1>
                <button class="add-folder-btn" onclick="addFolder()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg>
                    새 폴더
                </button>
            </div>
            <ul class="folder-list" id="folder-list">
                <!-- 자바스크립트로 렌더링 -->
            </ul>
        </aside>

        <!-- 우측 에디터 창 -->
        <main class="editor-container">
            <!-- 미선택 화면 -->
            <div class="empty-state" id="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                <p>좌측에서 프롬프트를 선택하거나 새로 만드세요.</p>
            </div>

            <!-- 실제 입력 창 -->
            <div class="editor-card" id="editor-card" style="display: none;">
                <div class="editor-header">
                    <input type="text" class="title-input" id="title-input" placeholder="제목 없음" oninput="autoSave()">
                    <button class="delete-prompt-btn" onclick="deleteActivePrompt()">삭제</button>
                </div>
                <textarea class="content-input" id="content-input" placeholder="여기에 프롬프트를 자유롭게 입력하세요..." oninput="autoSave()"></textarea>
            </div>
        </main>
    </div>

    <script>
        // 데이터 구조: [{ id, name, isOpen, prompts: [{ id, title, content }] }]
        let appData = JSON.parse(localStorage.getItem('apple_prompts_v2'));
        let activeFolderId = null;
        let activePromptId = null;

        const folderListEl = document.getElementById('folder-list');
        const editorCard = document.getElementById('editor-card');
        const emptyState = document.getElementById('empty-state');
        const titleInput = document.getElementById('title-input');
        const contentInput = document.getElementById('content-input');

        // 초기 데이터 세팅
        if (!appData || appData.length === 0) {
            appData = [{
                id: 'folder_' + Date.now(),
                name: '기본 폴더',
                isOpen: true,
                prompts: [{
                    id: 'prompt_' + Date.now(),
                    title: '환영합니다! 👋',
                    content: '좌측 사이드바의 [+] 버튼을 눌러 새 프롬프트를 추가해보세요.\n\n폴더를 만들어 용도별로 관리할 수도 있습니다.'
                }]
            }];
            saveToLocal();
        }

        // 전체 렌더링
        function renderSidebar() {
            folderListEl.innerHTML = '';
            
            appData.forEach(folder => {
                const folderLi = document.createElement('li');
                folderLi.className = `folder-item ${folder.isOpen ? 'open' : ''}`;
                
                // 폴더 헤더
                const headerDiv = document.createElement('div');
                headerDiv.className = 'folder-header';
                headerDiv.onclick = () => toggleFolder(folder.id);

                headerDiv.innerHTML = `
                    <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    <span class="folder-title" title="더블클릭하여 이름 변경" ondblclick="renameFolder(event, '${folder.id}')">${folder.name}</span>
                    <div class="folder-actions">
                        <button class="icon-btn" onclick="addPrompt(event, '${folder.id}')" title="새 프롬프트 추가">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        </button>
                        <button class="icon-btn delete" onclick="deleteFolder(event, '${folder.id}')" title="폴더 삭제">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    </div>
                `;

                // 프롬프트 리스트 (폴더 하위)
                const promptUl = document.createElement('ul');
                promptUl.className = 'prompt-list';
                
                folder.prompts.forEach(prompt => {
                    const promptLi = document.createElement('li');
                    promptLi.className = `prompt-item ${prompt.id === activePromptId ? 'active' : ''}`;
                    promptLi.textContent = prompt.title || '제목 없음';
                    promptLi.onclick = (e) => {
                        e.stopPropagation();
                        selectPrompt(folder.id, prompt.id);
                    };
                    promptUl.appendChild(promptLi);
                });

                folderLi.appendChild(headerDiv);
                folderLi.appendChild(promptUl);
                folderListEl.appendChild(folderLi);
            });
        }

        // 폴더 열기/닫기 토글
        function toggleFolder(folderId) {
            const folder = appData.find(f => f.id === folderId);
            if (folder) {
                folder.isOpen = !folder.isOpen;
                saveToLocal();
                renderSidebar();
            }
        }

        // 새 폴더 추가
        function addFolder() {
            const name = prompt("새 폴더의 이름을 입력하세요:", "새 폴더");
            if (name && name.trim() !== "") {
                appData.push({
                    id: 'folder_' + Date.now(),
                    name: name.trim(),
                    isOpen: true,
                    prompts: []
                });
                saveToLocal();
                renderSidebar();
            }
        }

        // 폴더 이름 변경
        function renameFolder(event, folderId) {
            event.stopPropagation();
            const folder = appData.find(f => f.id === folderId);
            const newName = prompt("폴더 이름을 변경하세요:", folder.name);
            if (newName && newName.trim() !== "") {
                folder.name = newName.trim();
                saveToLocal();
                renderSidebar();
            }
        }

        // 폴더 삭제
        function deleteFolder(event, folderId) {
            event.stopPropagation();
            if (confirm("이 폴더와 내부의 모든 프롬프트를 삭제하시겠습니까?")) {
                appData = appData.filter(f => f.id !== folderId);
                
                // 만약 삭제한 폴더 안의 프롬프트가 현재 켜져있다면 에디터 닫기
                if (activeFolderId === folderId) {
                    closeEditor();
                }
                saveToLocal();
                renderSidebar();
            }
        }

        // 새 프롬프트 추가 (특정 폴더에)
        function addPrompt(event, folderId) {
            event.stopPropagation();
            const folder = appData.find(f => f.id === folderId);
            if (!folder) return;

            const newPrompt = {
                id: 'prompt_' + Date.now(),
                title: '',
                content: ''
            };
            
            folder.prompts.unshift(newPrompt); // 폴더 최상단에 추가
            folder.isOpen = true; // 폴더 강제 열기
            
            saveToLocal();
            selectPrompt(folderId, newPrompt.id);
            titleInput.focus();
        }

        // 프롬프트 선택 및 에디터 열기
        function selectPrompt(folderId, promptId) {
            activeFolderId = folderId;
            activePromptId = promptId;

            const folder = appData.find(f => f.id === folderId);
            const prompt = folder.prompts.find(p => p.id === promptId);

            if (prompt) {
                titleInput.value = prompt.title;
                contentInput.value = prompt.content;
                
                emptyState.style.display = 'none';
                editorCard.style.display = 'flex';
                
                // 팝업 애니메이션 리셋 및 실행
                editorCard.classList.remove('show');
                void editorCard.offsetWidth; 
                editorCard.classList.add('show');
            }
            renderSidebar();
        }

        // 에디터 닫기 (삭제 시)
        function closeEditor() {
            activeFolderId = null;
            activePromptId = null;
            editorCard.style.display = 'none';
            emptyState.style.display = 'flex';
        }

        // 현재 활성화된 프롬프트 자동 저장
        function autoSave() {
            if (!activeFolderId || !activePromptId) return;
            
            const folder = appData.find(f => f.id === activeFolderId);
            const prompt = folder.prompts.find(p => p.id === activePromptId);
            
            if (prompt) {
                prompt.title = titleInput.value;
                prompt.content = contentInput.value;
                saveToLocal();
                renderSidebar(); // 사이드바 제목 실시간 업데이트
            }
        }

        // 현재 프롬프트 삭제
        function deleteActivePrompt() {
            if (!activeFolderId || !activePromptId) return;

            if (confirm("이 프롬프트를 삭제하시겠습니까?")) {
                const folder = appData.find(f => f.id === activeFolderId);
                folder.prompts = folder.prompts.filter(p => p.id !== activePromptId);
                
                closeEditor();
                saveToLocal();
                renderSidebar();
            }
        }

        // 로컬 스토리지 저장
        function saveToLocal() {
            localStorage.setItem('apple_prompts_v2', JSON.stringify(appData));
        }

        // 앱 시작 시 최초 렌더링
        renderSidebar();

    </script>
</body>
</html>
