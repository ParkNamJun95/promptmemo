<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프롬프트 보관함</title>
    <style>
        /* 애플 감성 시스템 색상 */
        :root {
            --bg-color: #f2f2f7; 
            --sidebar-bg: #f2f2f7;
            --card-bg: #ffffff;
            --text-primary: #1c1c1e;
            --text-secondary: #8e8e93;
            --accent-color: #007aff;
            --hover-color: #e5e5ea;
            --border-radius: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .app-container {
            display: flex;
            height: 100vh;
            padding: 20px;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ---------------- 좌측 사이드바 ---------------- */
        .sidebar {
            width: 320px;
            display: flex;
            flex-direction: column;
            background-color: transparent;
            height: 100%;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 10px 10px 10px;
        }

        .sidebar-header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .add-folder-btn {
            background: transparent;
            border: none;
            color: var(--accent-color);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 12px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .add-folder-btn:hover { background: rgba(0, 122, 255, 0.1); }

        /* 검색창 스타일 */
        .search-container {
            padding: 0 10px 16px 10px;
        }
        .search-input {
            width: 100%;
            padding: 8px 12px 8px 32px;
            border-radius: 10px;
            border: none;
            background-color: #e3e3e8;
            font-size: 15px;
            outline: none;
            color: var(--text-primary);
            background-image: url('data:image/svg+xml;utf8,<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="%238e8e93" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>');
            background-repeat: no-repeat;
            background-position: 10px center;
            transition: background-color 0.2s;
        }
        .search-input:focus { background-color: #d1d1d6; }
        .search-input::placeholder { color: #8e8e93; }

        .folder-list {
            list-style: none;
            overflow-y: auto;
            padding: 0 5px;
            flex: 1;
        }
        .folder-list::-webkit-scrollbar { width: 0px; }

        .folder-item { margin-bottom: 8px; }

        .folder-header {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 15px;
            user-select: none;
            -webkit-user-select: none;
        }
        .folder-header:hover { background-color: var(--hover-color); }

        /* 드래그 방해 요소 무효화 */
        .folder-title, .chevron-icon { pointer-events: none; }
        .folder-actions { pointer-events: auto; } /* 버튼은 클릭 가능해야 함 */

        .chevron-icon {
            width: 16px; height: 16px; margin-right: 8px;
            transition: transform 0.2s ease;
            color: var(--text-secondary);
        }
        .folder-item.open .chevron-icon { transform: rotate(90deg); }

        .folder-title {
            flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .folder-actions {
            display: flex; gap: 4px; opacity: 0; transition: opacity 0.2s;
        }
        .folder-header:hover .folder-actions { opacity: 1; }

        .icon-btn {
            background: transparent; border: none; color: var(--text-secondary);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            padding: 4px; border-radius: 6px;
        }
        .icon-btn:hover { background: rgba(0,0,0,0.08); color: var(--text-primary); }
        .icon-btn.delete:hover { color: #ff3b30; }

        .prompt-list {
            list-style: none; padding-left: 24px; display: none; margin-top: 4px;
        }
        .folder-item.open .prompt-list { display: block; }

        .prompt-item {
            padding: 10px 12px; border-radius: 10px; margin-bottom: 2px;
            cursor: pointer; transition: all 0.2s ease; font-size: 15px;
            color: var(--text-primary); white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; display: flex; align-items: center;
            user-select: none; -webkit-user-select: none;
        }
        .prompt-item::before {
            content: '📄'; margin-right: 8px; font-size: 13px; opacity: 0.7; pointer-events: none;
        }
        .prompt-item:hover { background-color: var(--hover-color); }
        .prompt-item.active { background-color: var(--accent-color); color: #ffffff; font-weight: 500; }
        .prompt-item.active::before { opacity: 1; }

        /* 드래그 앤 드롭 시각 효과 */
        .dragging { opacity: 0.4; }
        .drag-over {
            border-top: 2px solid var(--accent-color) !important;
            border-top-left-radius: 0 !important;
            border-top-right-radius: 0 !important;
            background-color: var(--hover-color);
        }

        /* 우측 메인 에디터 */
        .editor-container {
            flex: 1; display: flex; align-items: center; justify-content: center;
        }
        .editor-card {
            background-color: var(--card-bg); width: 100%; height: 100%;
            border-radius: var(--border-radius); padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04); display: flex; flex-direction: column;
            opacity: 0; transform: scale(0.98) translateY(10px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .editor-card.show { opacity: 1; transform: scale(1) translateY(0); }
        
        .editor-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        .title-input {
            flex: 1; font-size: 32px; font-weight: 700; border: none; outline: none;
            color: var(--text-primary); background: transparent; font-family: inherit;
            letter-spacing: -0.5px;
        }
        .title-input::placeholder { color: #d1d1d6; }
        
        /* 버튼 그룹 */
        .header-actions { display: flex; gap: 8px; align-items: center; }

        .save-btn {
            background: var(--accent-color); color: white; border: none; cursor: pointer;
            font-size: 14px; font-weight: 600; padding: 8px 16px; border-radius: 8px;
            transition: all 0.2s ease;
        }
        .save-btn:hover { opacity: 0.9; }
        .save-btn:active { transform: scale(0.96); }
        .save-btn.saved { background: #34c759; /* 애플 성공 초록색 */ }
        
        .delete-prompt-btn {
            background: transparent; border: none; color: #ff3b30; cursor: pointer;
            font-size: 14px; font-weight: 500; padding: 8px 12px; border-radius: 8px;
            transition: background 0.2s;
        }
        .delete-prompt-btn:hover { background: #ffe5e5; }
        
        .content-input {
            flex: 1; font-size: 16px; line-height: 1.6; border: none; outline: none;
            resize: none; color: #333; background: transparent; font-family: inherit;
        }
        .content-input::placeholder { color: #c7c7cc; }
        
        .empty-state {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; color: var(--text-secondary); font-size: 16px;
        }
        .empty-state svg { width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.4; }

        /* 커스텀 모달 (Confirm / Prompt 대체) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center;
            z-index: 1000; opacity: 0; transition: opacity 0.2s; backdrop-filter: blur(2px);
        }
        .modal-overlay.show { opacity: 1; }
        
        .modal-card {
            background: white; border-radius: 18px; padding: 24px; width: 320px; text-align: center;
            transform: scale(0.95); transition: transform 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        .modal-overlay.show .modal-card { transform: scale(1); }
        
        .modal-card h3 { font-size: 18px; margin-bottom: 8px; font-weight: 600; letter-spacing: -0.5px; }
        .modal-card p { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; word-break: keep-all; }
        
        .modal-input {
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #d1d1d6;
            margin-bottom: 20px; font-size: 15px; outline: none; transition: border-color 0.2s;
            font-family: inherit;
        }
        .modal-input:focus { border-color: var(--accent-color); }
        
        .modal-actions { display: flex; gap: 10px; }
        .modal-btn {
            flex: 1; padding: 12px; border-radius: 12px; border: none; font-size: 15px;
            font-weight: 600; cursor: pointer; transition: opacity 0.2s;
        }
        .modal-btn:active { opacity: 0.7; }
        .modal-btn.cancel { background: #e5e5ea; color: #1c1c1e; }
        .modal-btn.danger { background: #ff3b30; color: white; }
        .modal-btn.primary { background: var(--accent-color); color: white; }

        /* 검색 하이라이트 */
        .highlight { color: var(--accent-color); font-weight: 700; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 좌측 사이드바 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>프롬프트</h1>
                <button class="add-folder-btn" onclick="openAddFolderModal()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg>
                    새 폴더
                </button>
            </div>
            
            <!-- 통합 검색창 -->
            <div class="search-container">
                <input type="text" id="search-input" class="search-input" placeholder="검색 (제목 및 내용)" oninput="handleSearch()">
            </div>

            <ul class="folder-list" id="folder-list">
                <!-- JS 렌더링 영역 -->
            </ul>
        </aside>

        <!-- 우측 에디터 창 -->
        <main class="editor-container">
            <div class="empty-state" id="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                <p>좌측에서 프롬프트를 선택하거나 새로 만드세요.</p>
            </div>

            <div class="editor-card" id="editor-card" style="display: none;">
                <div class="editor-header">
                    <input type="text" class="title-input" id="title-input" placeholder="제목 없음" oninput="autoSave()">
                    <div class="header-actions">
                        <button class="save-btn" id="save-btn" onclick="manualSave()">저장</button>
                        <button class="delete-prompt-btn" onclick="requestDeletePrompt()">삭제</button>
                    </div>
                </div>
                <textarea class="content-input" id="content-input" placeholder="여기에 프롬프트를 자유롭게 입력하세요..." oninput="autoSave()"></textarea>
            </div>
        </main>
    </div>

    <!-- 확인 모달 (Confirm 대체) -->
    <div id="confirm-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h3 id="confirm-modal-title">알림</h3>
            <p id="confirm-modal-desc">정말 진행하시겠습니까?</p>
            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="closeConfirmModal()">취소</button>
                <button class="modal-btn danger" id="confirm-modal-btn">삭제</button>
            </div>
        </div>
    </div>

    <!-- 입력 모달 (Prompt 대체) -->
    <div id="input-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h3 id="input-modal-title">입력</h3>
            <input type="text" id="input-modal-field" class="modal-input" placeholder="이름을 입력하세요" />
            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="closeInputModal()">취소</button>
                <button class="modal-btn primary" id="input-modal-btn">확인</button>
            </div>
        </div>
    </div>

    <script>
        // 데이터 구조
        let appData = JSON.parse(localStorage.getItem('apple_prompts_v3'));
        let activeFolderId = null;
        let activePromptId = null;
        let currentSearchTerm = '';

        const folderListEl = document.getElementById('folder-list');
        const editorCard = document.getElementById('editor-card');
        const emptyState = document.getElementById('empty-state');
        const titleInput = document.getElementById('title-input');
        const contentInput = document.getElementById('content-input');

        // 초기 데이터 세팅 및 구버전 데이터 자동 복구
        if (!appData || appData.length === 0) {
            // 브라우저에 남아있는 예전 버전의 데이터들을 찾습니다.
            const oldDataV2 = JSON.parse(localStorage.getItem('apple_prompts_v2'));
            const oldDataV1 = JSON.parse(localStorage.getItem('apple_prompts'));

            if (oldDataV2 && oldDataV2.length > 0) {
                // v2(폴더 기능만 있던 버전) 데이터 복구
                appData = oldDataV2;
                localStorage.setItem('apple_prompts_v3', JSON.stringify(appData));
            } else if (oldDataV1 && oldDataV1.length > 0) {
                // v1(폴더 없이 리스트만 있던 버전) 데이터 복구
                appData = [{
                    id: 'folder_' + Date.now(),
                    name: '복구된 이전 프롬프트',
                    isOpen: true,
                    prompts: oldDataV1
                }];
                localStorage.setItem('apple_prompts_v3', JSON.stringify(appData));
            } else {
                // 정말 데이터가 하나도 없는 처음 상태일 때만 기본값 세팅
                appData = [{
                    id: 'folder_' + Date.now(),
                    name: '기본 폴더',
                    isOpen: true,
                    prompts: [{
                        id: 'prompt_' + Date.now(),
                        title: '환영합니다! 👋',
                        content: '좌측 사이드바의 [+] 버튼을 눌러 새 프롬프트를 추가해보세요.\n드래그 앤 드롭으로 순서를 변경하거나 폴더를 이동할 수 있습니다!'
                    }]
                }];
                localStorage.setItem('apple_prompts_v3', JSON.stringify(appData));
            }
        }

        // ================= 모달 시스템 =================
        let confirmCallback = null;
        function showConfirmModal(title, desc, callback) {
            document.getElementById('confirm-modal-title').textContent = title;
            document.getElementById('confirm-modal-desc').textContent = desc;
            confirmCallback = callback;
            const modal = document.getElementById('confirm-modal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
        }
        function closeConfirmModal() {
            const modal = document.getElementById('confirm-modal');
            modal.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 200);
            confirmCallback = null;
        }
        document.getElementById('confirm-modal-btn').addEventListener('click', () => {
            if (confirmCallback) confirmCallback();
            closeConfirmModal();
        });

        let inputCallback = null;
        function showInputModal(title, defaultValue, callback) {
            document.getElementById('input-modal-title').textContent = title;
            const inputField = document.getElementById('input-modal-field');
            inputField.value = defaultValue || '';
            inputCallback = callback;
            const modal = document.getElementById('input-modal');
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.classList.add('show');
                inputField.focus();
                inputField.select();
            }, 10);
        }
        function closeInputModal() {
            const modal = document.getElementById('input-modal');
            modal.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 200);
            inputCallback = null;
        }
        document.getElementById('input-modal-btn').addEventListener('click', () => {
            const val = document.getElementById('input-modal-field').value;
            if (inputCallback) inputCallback(val);
            closeInputModal();
        });
        document.getElementById('input-modal-field').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const val = document.getElementById('input-modal-field').value;
                if (inputCallback) inputCallback(val);
                closeInputModal();
            }
        });

        // ================= 렌더링 및 검색 =================
        function handleSearch() {
            currentSearchTerm = document.getElementById('search-input').value.toLowerCase().trim();
            renderSidebar();
        }

        function highlightText(text, term) {
            if (!term) return text;
            const regex = new RegExp(`(${term})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        function renderSidebar() {
            folderListEl.innerHTML = '';
            
            appData.forEach(folder => {
                const folderMatches = folder.name.toLowerCase().includes(currentSearchTerm);
                
                // 검색 필터링
                const matchingPrompts = folder.prompts.filter(p => {
                    if (!currentSearchTerm) return true;
                    return (p.title && p.title.toLowerCase().includes(currentSearchTerm)) || 
                           (p.content && p.content.toLowerCase().includes(currentSearchTerm));
                });

                // 검색 중인데 폴더 이름도 안 맞고, 내부 프롬프트도 없으면 폴더 자체 숨김
                if (currentSearchTerm && !folderMatches && matchingPrompts.length === 0) {
                    return; 
                }

                const folderLi = document.createElement('li');
                // 검색 중이면 폴더를 강제로 열어둠
                const isOpen = currentSearchTerm ? true : folder.isOpen;
                folderLi.className = `folder-item ${isOpen ? 'open' : ''}`;
                
                const headerDiv = document.createElement('div');
                headerDiv.className = 'folder-header';
                headerDiv.onclick = () => toggleFolder(folder.id);

                const displayName = currentSearchTerm ? highlightText(folder.name, currentSearchTerm) : folder.name;

                headerDiv.innerHTML = `
                    <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    <span class="folder-title" title="더블클릭하여 이름 변경" ondblclick="openRenameFolderModal(event, '${folder.id}')">${displayName}</span>
                    <div class="folder-actions">
                        <button class="icon-btn" onclick="addPrompt(event, '${folder.id}')" title="새 프롬프트 추가">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        </button>
                        <button class="icon-btn delete" onclick="requestDeleteFolder(event, '${folder.id}')" title="폴더 삭제">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    </div>
                `;

                // 드래그 앤 드롭 이벤트 등록 (검색 중이 아닐 때만 활성화)
                if (!currentSearchTerm) {
                    headerDiv.setAttribute('draggable', 'true');
                    headerDiv.addEventListener('dragstart', (e) => onDragStart(e, 'folder', folder.id));
                    headerDiv.addEventListener('dragover', onDragOver);
                    headerDiv.addEventListener('dragleave', onDragLeave);
                    headerDiv.addEventListener('drop', (e) => onDropFolder(e, folder.id));
                    headerDiv.addEventListener('dragend', onDragEnd);
                }

                // 프롬프트 리스트 (폴더 하위)
                const promptUl = document.createElement('ul');
                promptUl.className = 'prompt-list';
                
                const promptsToRender = currentSearchTerm ? matchingPrompts : folder.prompts;

                promptsToRender.forEach(prompt => {
                    const promptLi = document.createElement('li');
                    promptLi.className = `prompt-item ${prompt.id === activePromptId ? 'active' : ''}`;
                    
                    const titleText = prompt.title || '제목 없음';
                    promptLi.innerHTML = currentSearchTerm ? highlightText(titleText, currentSearchTerm) : titleText;
                    
                    promptLi.onclick = (e) => {
                        e.stopPropagation();
                        selectPrompt(folder.id, prompt.id);
                    };

                    if (!currentSearchTerm) {
                        promptLi.setAttribute('draggable', 'true');
                        promptLi.addEventListener('dragstart', (e) => onDragStart(e, 'prompt', prompt.id, folder.id));
                        promptLi.addEventListener('dragover', onDragOver);
                        promptLi.addEventListener('dragleave', onDragLeave);
                        promptLi.addEventListener('drop', (e) => onDropPrompt(e, prompt.id, folder.id));
                        promptLi.addEventListener('dragend', onDragEnd);
                    }

                    promptUl.appendChild(promptLi);
                });

                folderLi.appendChild(headerDiv);
                folderLi.appendChild(promptUl);
                folderListEl.appendChild(folderLi);
            });
        }

        // ================= 드래그 앤 드롭 =================
        let draggedItem = { type: null, id: null, parentId: null };

        function onDragStart(e, type, id, parentId = null) {
            draggedItem = { type, id, parentId };
            e.currentTarget.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', id); // 파이어폭스 호환용
        }

        function onDragOver(e) {
            e.preventDefault(); // 드롭 허용
            e.currentTarget.classList.add('drag-over');
        }

        function onDragLeave(e) {
            // 자식 요소에서 벗어날 때 깜빡임 방지
            if (!e.currentTarget.contains(e.relatedTarget)) {
                e.currentTarget.classList.remove('drag-over');
            }
        }

        // 폴더 헤더에 드롭했을 때
        function onDropFolder(e, targetFolderId) {
            e.preventDefault();
            e.stopPropagation();
            e.currentTarget.classList.remove('drag-over');
            
            if (draggedItem.type === 'folder' && draggedItem.id !== targetFolderId) {
                // 폴더 순서 변경
                const srcIdx = appData.findIndex(f => f.id === draggedItem.id);
                const targetIdx = appData.findIndex(f => f.id === targetFolderId);
                const [moved] = appData.splice(srcIdx, 1);
                appData.splice(targetIdx, 0, moved);
                
                saveToLocal(); renderSidebar();
            } else if (draggedItem.type === 'prompt') {
                // 프롬프트를 해당 폴더의 가장 마지막으로 이동
                if (draggedItem.parentId === targetFolderId) return; 
                
                const srcFolder = appData.find(f => f.id === draggedItem.parentId);
                const targetFolder = appData.find(f => f.id === targetFolderId);
                const srcIdx = srcFolder.prompts.findIndex(p => p.id === draggedItem.id);
                
                const [moved] = srcFolder.prompts.splice(srcIdx, 1);
                targetFolder.prompts.push(moved);
                targetFolder.isOpen = true; // 이동한 폴더 열어주기
                
                saveToLocal(); renderSidebar();
            }
        }

        // 프롬프트 아이템에 드롭했을 때
        function onDropPrompt(e, targetPromptId, targetFolderId) {
            e.preventDefault();
            e.stopPropagation();
            e.currentTarget.classList.remove('drag-over');

            if (draggedItem.type === 'prompt' && draggedItem.id !== targetPromptId) {
                // 프롬프트 순서 변경 및 폴더간 이동
                const srcFolder = appData.find(f => f.id === draggedItem.parentId);
                const targetFolder = appData.find(f => f.id === targetFolderId);
                
                const srcIdx = srcFolder.prompts.findIndex(p => p.id === draggedItem.id);
                const [moved] = srcFolder.prompts.splice(srcIdx, 1);
                
                const targetIdx = targetFolder.prompts.findIndex(p => p.id === targetPromptId);
                targetFolder.prompts.splice(targetIdx, 0, moved);
                
                if (draggedItem.parentId !== targetFolderId) targetFolder.isOpen = true;
                
                saveToLocal(); renderSidebar();
            }
        }

        function onDragEnd(e) {
            e.currentTarget.classList.remove('dragging');
            document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
            draggedItem = { type: null, id: null, parentId: null };
        }

        // ================= CRUD 및 동작 =================
        function toggleFolder(folderId) {
            if(currentSearchTerm) return; // 검색 중일 땐 폴더 토글 비활성
            const folder = appData.find(f => f.id === folderId);
            if (folder) {
                folder.isOpen = !folder.isOpen;
                saveToLocal(); renderSidebar();
            }
        }

        function openAddFolderModal() {
            showInputModal("새 폴더", "", (name) => {
                if (name && name.trim() !== "") {
                    appData.push({
                        id: 'folder_' + Date.now(),
                        name: name.trim(),
                        isOpen: true,
                        prompts: []
                    });
                    saveToLocal(); renderSidebar();
                }
            });
        }

        function openRenameFolderModal(event, folderId) {
            event.stopPropagation();
            const folder = appData.find(f => f.id === folderId);
            showInputModal("폴더 이름 변경", folder.name, (newName) => {
                if (newName && newName.trim() !== "") {
                    folder.name = newName.trim();
                    saveToLocal(); renderSidebar();
                }
            });
        }

        function requestDeleteFolder(event, folderId) {
            event.stopPropagation();
            showConfirmModal(
                "폴더 삭제", 
                "이 폴더와 내부의 모든 프롬프트를 삭제하시겠습니까?", 
                () => {
                    appData = appData.filter(f => f.id !== folderId);
                    if (activeFolderId === folderId) closeEditor();
                    saveToLocal(); renderSidebar();
                }
            );
        }

        function addPrompt(event, folderId) {
            event.stopPropagation();
            const folder = appData.find(f => f.id === folderId);
            if (!folder) return;

            const newPrompt = { id: 'prompt_' + Date.now(), title: '', content: '' };
            folder.prompts.unshift(newPrompt);
            folder.isOpen = true;
            
            // 검색 중이면 검색어 초기화 후 새 프롬프트로 이동
            if(currentSearchTerm) {
                document.getElementById('search-input').value = '';
                currentSearchTerm = '';
            }
            
            saveToLocal();
            selectPrompt(folderId, newPrompt.id);
            titleInput.focus();
        }

        function selectPrompt(folderId, promptId) {
            activeFolderId = folderId;
            activePromptId = promptId;

            const folder = appData.find(f => f.id === folderId);
            const prompt = folder.prompts.find(p => p.id === promptId);

            if (prompt) {
                titleInput.value = prompt.title;
                contentInput.value = prompt.content;
                
                emptyState.style.display = 'none';
                editorCard.style.display = 'flex';
                
                editorCard.classList.remove('show');
                void editorCard.offsetWidth; 
                editorCard.classList.add('show');
            }
            renderSidebar();
        }

        function closeEditor() {
            activeFolderId = null;
            activePromptId = null;
            editorCard.style.display = 'none';
            emptyState.style.display = 'flex';
        }

        function autoSave() {
            if (!activeFolderId || !activePromptId) return;
            const folder = appData.find(f => f.id === activeFolderId);
            const prompt = folder.prompts.find(p => p.id === activePromptId);
            
            if (prompt) {
                prompt.title = titleInput.value;
                prompt.content = contentInput.value;
                saveToLocal(); renderSidebar();
            }
        }

        // 수동 저장 및 시각적 피드백 효과
        function manualSave() {
            if (!activeFolderId || !activePromptId) return;
            
            // 데이터 저장
            autoSave();

            // UI 피드백 (버튼 텍스트 및 색상 변경)
            const saveBtn = document.getElementById('save-btn');
            saveBtn.textContent = '저장완료!';
            saveBtn.classList.add('saved');
            
            // 1.5초 뒤 원래 상태로 복구
            setTimeout(() => {
                saveBtn.textContent = '저장';
                saveBtn.classList.remove('saved');
            }, 1500);
        }

        function requestDeletePrompt() {
            if (!activeFolderId || !activePromptId) return;
            showConfirmModal(
                "프롬프트 삭제", 
                "현재 작성 중인 프롬프트를 삭제하시겠습니까?", 
                () => {
                    const folder = appData.find(f => f.id === activeFolderId);
                    folder.prompts = folder.prompts.filter(p => p.id !== activePromptId);
                    closeEditor(); saveToLocal(); renderSidebar();
                }
            );
        }

        function saveToLocal() {
            localStorage.setItem('apple_prompts_v3', JSON.stringify(appData));
        }

        // 최초 렌더링
        renderSidebar();

    </script>
</body>
</html>
